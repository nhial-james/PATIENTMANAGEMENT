services:
  app:
    build: .
    image: patient-management:latest
    container_name: patient-management-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "file:/app/data/dev.db"
      SEED_ON_START: "true"
      # Trust Nginx as the proxy so req.ip is correct
      TRUST_PROXY: "1"
    volumes:
      - pm-data:/app/data
    expose:
      - "3000"          # internal only; Nginx talks to this
    # ports:            # uncomment to bypass Nginx for debugging
    #   - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: patient-management-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx-logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pm-data:
  nginx-logs: