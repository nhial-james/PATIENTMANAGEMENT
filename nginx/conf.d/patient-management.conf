# ---------- Upstream: the Node app inside Kubernetes ----------
upstream patient_management_app {
    # K8s Service DNS name: <service>.<namespace>.svc.cluster.local
    server patientmanagement-prod-service.patientmanagement-prod.svc.cluster.local:5173 max_fails=3 fail_timeout=15s;

    # Enable HTTP keepalive to the app
    keepalive 32;
}

# ---------- HTTP: redirect to HTTPS (except ACME) ----------
server {
    listen 80;
    listen [::]:80;
    server_name patient.craygroup.biz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name patient.craygroup.biz;

    # ---- TLS ----
    ssl_certificate         /etc/letsencrypt/live/patient.craygroup.biz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/patient.craygroup.biz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/patient.craygroup.biz/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # ---- Logging ----
    access_log /var/log/nginx/patient-management.access.log main;
    error_log  /var/log/nginx/patient-management.error.log warn;

    # ---- Proxy defaults ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_connect_timeout 10s;

    # ---- Buffering ----
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # ---------- ACME passthrough ----------
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------- Auth endpoints: tight rate limit ----------
    location ~ ^/(api/)?(auth|login|signin) {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://patient_management_app;
    }

    # ---------- API ----------
    location /api/ {
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://patient_management_app;
    }

    # ---------- Static assets: long cache ----------
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://patient_management_app;
        proxy_cache_valid 200 302 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ---------- Health check ----------
    location = /health {
        proxy_pass http://patient_management_app;
        access_log off;
        limit_req off;
    }

    # ---------- Everything else ----------
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://patient_management_app;
    }

    # ---------- Deny hidden files ----------
    location ~ /\.(?!well-known) {
        deny all;
    }
}