user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- Logging ----
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ---- Performance ----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;
    server_tokens   off;

    # ---- Body size (adjust for uploads) ----
    client_max_body_size 25m;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml;

    # ---- Rate limit zones ----
    # General requests: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    # Login/auth: 5 req/min per IP (tighter)
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    # API: 60 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/s;

    # ---- Real IP from upstream proxies (only if behind another LB) ----
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}